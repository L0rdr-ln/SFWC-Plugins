name: build
on: [push, pull_request]
env:
  # The compositor the plugins are built and tested against (a branch or tag of the sfwc repository).
  SFWC_REF: plugin-hooks
jobs:
  unit-tests:
    timeout-minutes: 10
    # The pure parts (spring mesh, curves, animation rules, flames) with sanitizers; no compositor.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get -o Acquire::Retries=3 update && sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get -o Acquire::Retries=3 install -y meson ninja-build gcc pkg-config libcairo2-dev
      - run: meson setup build-unit -Dmodules=false -Db_sanitize=address,undefined -Db_lundef=false
      - run: meson test -C build-unit --print-errorlogs
        env:
          ASAN_OPTIONS: detect_leaks=0

  plugins:
    timeout-minutes: 40
    # sfwc is a meson subproject (with its own wlroots): the plugins are built against exactly
    # that, then sfwc's end-to-end scenarios run with the plugins loaded.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check out sfwc
        uses: actions/checkout@v4
        with:
          repository: L0rdr-ln/Simple-Floating-Wayland-Compositor
          ref: ${{ env.SFWC_REF }}
          path: subprojects/sfwc
      - name: Install dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get -o Acquire::Retries=3 install -y meson ninja-build pkg-config gcc git cmake bison flex \
            libwayland-dev wayland-protocols libxkbcommon-dev libcairo2-dev libpango1.0-dev libfontconfig-dev fonts-dejavu-core libpixman-1-dev \
            libdrm-dev libinput-dev libudev-dev libseat-dev libegl-dev libgles-dev \
            libgbm-dev libvulkan-dev glslang-tools hwdata libdisplay-info-dev \
            libliftoff-dev libxcb1-dev libxcb-composite0-dev libxcb-icccm4-dev \
            libxcb-render0-dev libxcb-xfixes0-dev libxcb-res0-dev libxcb-ewmh-dev \
            libxcb-dri3-dev libxcb-present-dev libxcb-shm0-dev libxcb-xinput-dev \
            libxcb-render-util0-dev
      - name: Newer meson (wlroots needs meson >= 1.4)
        run: python3 -m pip install --user "meson>=1.4,<2" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: meson setup build -De2e=true -Dwlroots:examples=false -Dwayland:documentation=false -Dwayland:tests=false -Dwayland:dtd_validation=false
      - run: meson compile -C build
      - name: Unit tests and end-to-end scenarios of the plugins
        run: meson test -C build --suite sfwc-plugins --print-errorlogs
